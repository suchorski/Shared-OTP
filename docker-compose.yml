services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: otp-api
    ports:
      - "${API_BIND_IP:-0.0.0.0}:${API_PORT:-7126}:${API_PORT:-7126}"
    environment:
      PORT: ${API_PORT:-7126}
      BIND_HOST: ${BIND_HOST:-0.0.0.0}
      NODE_ENV: ${NODE_ENV}
      TZ: America/Sao_Paulo
      DATABASE_URL: ${DATABASE_URL}
      LDAP_URL: ${LDAP_URL}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_USER_BASE_DN: ${LDAP_USER_BASE_DN}
      LDAP_UID_ATTRIBUTE: ${LDAP_UID_ATTRIBUTE}
      LDAP_SARAM_ATTRIBUTE: ${LDAP_SARAM_ATTRIBUTE}
      LDAP_MAIL_ATTRIBUTE: ${LDAP_MAIL_ATTRIBUTE}
      LDAP_NAME_ATTRIBUTE: ${LDAP_NAME_ATTRIBUTE}
      LDAP_OM_ATTRIBUTE: ${LDAP_OM_ATTRIBUTE}
      LDAP_RANK_ATTRIBUTE: ${LDAP_RANK_ATTRIBUTE}
      LDAP_WARNAME_ATTRIBUTE: ${LDAP_WARNAME_ATTRIBUTE}
      LDAP_TIMEOUT_MS: ${LDAP_TIMEOUT_MS}
      JWT_SECRET: ${JWT_SECRET}
      OTP_ENCRYPTION_KEY: ${OTP_ENCRYPTION_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      TEST_MODE: ${TEST_MODE}
      INITIAL_USER_CPF: ${INITIAL_USER_CPF}
    networks:
      - otp-network
    restart: unless-stopped

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: otp-app
    ports:
      - "${APP_PORT:-7125}:${APP_PORT:-7125}"
    environment:
      PORT: ${APP_PORT:-7125}
    depends_on:
      - api
    networks:
      - otp-network
    restart: unless-stopped

networks:
  otp-network:
    driver: bridge
